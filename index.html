<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POS Flourich</title>
    
    <!-- Script/Tag untuk menampilkan logo di tab browser -->
    <link href="https://raw.githubusercontent.com/Flourich-store/Pos-Flourich/main/flourich_logo.png" rel="icon" type="image/png">
    
    <style>
        /* Reset margin agar penuh satu layar */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden; /* Mencegah scroll ganda di body */
        }

        /* Container khusus untuk memaksa iframe bisa di-scroll di HP */
        .iframe-container {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            overflow-y: auto; 
            -webkit-overflow-scrolling: touch; /* Sangat penting untuk HP */
        }

        /* Iframe dibuat memenuhi container */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <div class="iframe-container">
        <!-- Ganti atribut src dengan URL Google Apps Script kamu -->
        <iframe src="https://script.google.com/macros/s/AKfycbzNNhSQCDyaxcZ5m1_2oiPrbyUOctjthaBW7HKOYk2L6ngDIi95FEQSgED2XmBAaOihOg/exec"></iframe>
    </div>

</body>
</html>
